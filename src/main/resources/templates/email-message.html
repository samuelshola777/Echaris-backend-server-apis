<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${title}">Echaris</title>
</head>

<body style="margin:0;padding:24px;background:#f5f7f5;font-family:Arial,sans-serif;color:#25352b;">

<table role="presentation"
       style="width:100%;border-collapse:collapse;">
    <tr>
        <td align="center">

            <table role="presentation"
                   style="width:100%;max-width:560px;background:#ffffff;border-radius:12px;border-collapse:collapse;">
                <tr>
                    <td style="padding:28px;">

                        <p style="margin-top:0;color:#ff5a00;font-size:22px;font-weight:bold;">
                            Echaris
                        </p>

                        <h2 th:text="${title}">
                            Account update
                        </h2>

                        <p>
                            Hello
                            <span th:text="${name}">there</span>,
                        </p>

                        <p th:text="${instruction}">
                            You have an account update.
                        </p>

                        <div th:if="${otp != null}">
                            <p th:text="${otp}"
                               style="padding:16px;background:#fff2e8;color:#b33d00;font-size:28px;font-weight:bold;letter-spacing:4px;text-align:center;">
                                123456
                            </p>

                            <p>
                                Use this code before it expires.
                                Do not share it with anyone.
                            </p>

                            <p>
                                If you did not request this,
                                you can ignore this email.
                            </p>
                        </div>

                        <p>The Echaris team</p>

                    </td>
                </tr>
            </table>

        </td>
    </tr>
</table>

</body>
</html>
