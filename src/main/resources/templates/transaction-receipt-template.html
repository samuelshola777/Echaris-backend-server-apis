<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Receipt</title>
</head>

<body style="margin:0; padding:32px; background:#f4f4f4; font-family:Arial, sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0">
    <tr>
        <td align="center">

            <table width="360" cellpadding="0" cellspacing="0"
                   style="background:#066b96; color:#ffffff; border-radius:22px; padding:28px 24px;">

                <tr>
                    <td align="center" style="padding-bottom:22px;">
                        <div style="width:58px; height:58px; border-radius:50%; background:#1289a9; display:inline-block; text-align:center; line-height:58px;">
                            <span style="display:inline-block; width:28px; height:28px; border-radius:50%; background:#45d47f; color:#066b96; line-height:28px; font-size:18px; font-weight:bold;">
                                ✓
                            </span>
                        </div>
                    </td>
                </tr>

                <tr>
                    <td align="center" style="color:#b9d9e8; font-size:16px; padding-bottom:10px;">
                        Total Amount
                    </td>
                </tr>

                <tr>
                    <td align="center" style="font-size:28px; font-weight:700; padding-bottom:34px;"
                        th:text="${amount}">
                        £45,000
                    </td>
                </tr>

                <tr>
                    <td style="border-top:1px solid rgba(255,255,255,0.22); padding-top:28px;">

                        <table width="100%" cellpadding="0" cellspacing="0">

                            <tr>
                                <td style="color:#b9d9e8; font-size:14px; padding-bottom:16px;">Pay Date</td>
                                <td align="right" style="color:#ffffff; font-size:14px; font-weight:700; padding-bottom:16px;"
                                    th:text="${paymentDate}">
                                    15 September 2025
                                </td>
                            </tr>

                            <tr th:if="${serviceType != null}">
                                <td style="color:#b9d9e8; font-size:14px; padding-bottom:16px;">Service</td>
                                <td align="right" style="color:#ffffff; font-size:14px; font-weight:700; padding-bottom:16px;"
                                    th:text="${serviceType}">
                                    Nominee
                                </td>
                            </tr>

                            <tr th:if="${invoiceId != null}">
                                <td style="color:#b9d9e8; font-size:14px; padding-bottom:16px;">Invoice ID</td>
                                <td align="right" style="color:#ffffff; font-size:14px; font-weight:700; padding-bottom:16px;"
                                    th:text="${invoiceId}">
                                    INV-001
                                </td>
                            </tr>

                            <tr th:if="${transactionId != null}">
                                <td style="color:#b9d9e8; font-size:14px; padding-bottom:16px;">Transaction ID</td>
                                <td align="right" style="color:#ffffff; font-size:14px; font-weight:700; padding-bottom:16px;"
                                    th:text="${transactionId}">
                                    TXN-001
                                </td>
                            </tr>

                            <tr th:if="${status != null}">
                                <td style="color:#b9d9e8; font-size:14px; padding-bottom:16px;">Status</td>
                                <td align="right" style="color:#ffffff; font-size:14px; font-weight:700; padding-bottom:16px;"
                                    th:text="${status}">
                                    PAID
                                </td>
                            </tr>

                            <tr th:if="${description != null}">
                                <td style="color:#b9d9e8; font-size:14px; padding-bottom:0;">Description</td>
                                <td align="right" style="color:#ffffff; font-size:14px; font-weight:700; line-height:1.35; padding-bottom:0;"
                                    th:text="${description}">
                                    Payment receipt
                                </td>
                            </tr>

                        </table>

                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
