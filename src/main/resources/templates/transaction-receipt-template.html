<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Payment Receipt</title>
    <style>
        @media only screen and (max-width:480px) {
            .ledger-outer { padding:12px 8px !important; }
            .ledger-content { padding:18px 16px !important; }
            .ledger-title { font-size:27px !important; }
        }
    </style>
</head>

<body style="margin:0;padding:0;background-color:#fff8f3;color:#29211d;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.55;">
<table width="100%" role="presentation" cellpadding="0" cellspacing="0" border="0" bgcolor="#fff8f3" style="width:100%;background-color:#fff8f3;">
    <tr><td align="center" class="ledger-outer" style="padding:20px 12px;">
        <!--[if mso]><table role="presentation" width="648" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
        <table width="100%" role="presentation" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="width:100%;max-width:648px;background-color:#ffffff;border:1px solid #e5bda5;border-top:2px solid #a63b15;">
            <tr><td style="padding:0;color:#29211d;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.55;">
                <div style="padding:20px 24px 0;"><p style="margin:0;padding:0 0 12px;border-bottom:1px solid #e5bda5;color:#a63b15;font-family:Arial,Helvetica,sans-serif;font-size:22px;line-height:1.2;font-weight:bold;">Echaris</p></div>
                <table width="100%" cellpadding="0" cellspacing="0">
                    <tr>
                        <td align="center">

                            <table width="100%" cellpadding="0" cellspacing="0" style="background:#ffffff; color:#29211d; border-radius:0; padding:28px 24px;">

                                <tr>
                                    <td align="center" style="padding-bottom:22px;">
                                        <div style="width:58px; height:58px; border-radius:0; background:#ffffff; display:inline-block; text-align:center; line-height:58px;">
                            <span style="display:inline-block; width:28px; height:28px; border-radius:0; background:#ffffff; color:#29211d; line-height:28px; font-size:18px; font-weight:bold;">
                                ✓
                            </span>
                                        </div>
                                    </td>
                                </tr>

                                <tr>
                                    <td align="center" style="color:#29211d; font-size:16px; padding-bottom:10px;">
                                        Total Amount
                                    </td>
                                </tr>

                                <tr>
                                    <td align="center" style="font-size:28px; font-weight:700; padding-bottom:34px;" th:text="${amount}">
                                        £45,000
                                    </td>
                                </tr>

                                <tr>
                                    <td style="border-top:1px solid #e5bda5; padding-top:28px;">

                                        <table width="100%" cellpadding="0" cellspacing="0">

                                            <tr>
                                                <td style="color:#29211d; font-size:14px; padding-bottom:16px;">Pay Date</td>
                                                <td align="right" style="color:#29211d; font-size:14px; font-weight:700; padding-bottom:16px;" th:text="${paymentDate}">
                                                    15 September 2025
                                                </td>
                                            </tr>

                                            <tr th:if="${serviceType != null}">
                                                <td style="color:#29211d; font-size:14px; padding-bottom:16px;">Service</td>
                                                <td align="right" style="color:#29211d; font-size:14px; font-weight:700; padding-bottom:16px;" th:text="${serviceType}">
                                                    Nominee
                                                </td>
                                            </tr>

                                            <tr th:if="${invoiceId != null}">
                                                <td style="color:#29211d; font-size:14px; padding-bottom:16px;">Invoice ID</td>
                                                <td align="right" style="color:#29211d; font-size:14px; font-weight:700; padding-bottom:16px;" th:text="${invoiceId}">
                                                    INV-001
                                                </td>
                                            </tr>

                                            <tr th:if="${transactionId != null}">
                                                <td style="color:#29211d; font-size:14px; padding-bottom:16px;">Transaction ID</td>
                                                <td align="right" style="color:#29211d; font-size:14px; font-weight:700; padding-bottom:16px;" th:text="${transactionId}">
                                                    TXN-001
                                                </td>
                                            </tr>

                                            <tr th:if="${status != null}">
                                                <td style="color:#29211d; font-size:14px; padding-bottom:16px;">Status</td>
                                                <td align="right" style="color:#29211d; font-size:14px; font-weight:700; padding-bottom:16px;" th:text="${status}">
                                                    PAID
                                                </td>
                                            </tr>

                                            <tr th:if="${description != null}">
                                                <td style="color:#29211d; font-size:14px; padding-bottom:0;">Description</td>
                                                <td align="right" style="color:#29211d; font-size:14px; font-weight:700; line-height:1.35; padding-bottom:0;" th:text="${description}">
                                                    Payment receipt
                                                </td>
                                            </tr>

                                        </table>

                                    </td>
                                </tr>

                            </table>

                        </td>
                    </tr>
                </table>

            </td></tr>

        </table>
        <!--[if mso]></td></tr></table><![endif]-->
    </td></tr>
</table>
</body>
</html>
