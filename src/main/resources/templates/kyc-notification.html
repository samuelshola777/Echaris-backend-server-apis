<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title th:text="${title}">KYC update</title>
    <style>
        @media only screen and (max-width:480px) {
            .ledger-outer { padding:12px 8px !important; }
            .ledger-content { padding:18px 16px !important; }
            .ledger-title { font-size:27px !important; }
        }
    </style>
</head>

<body style="margin:0;padding:0;background-color:#fff8f3;color:#29211d;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.55;">
<table width="100%" role="presentation" cellpadding="0" cellspacing="0" border="0" bgcolor="#fff8f3" style="width:100%;background-color:#fff8f3;">
    <tr><td align="center" class="ledger-outer" style="padding:20px 12px;">
        <!--[if mso]><table role="presentation" width="648" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
        <table width="100%" role="presentation" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="width:100%;max-width:648px;background-color:#ffffff;border:1px solid #e5bda5;">
            <tr><td class="ledger-content" style="padding:22px 24px 24px;color:#29211d;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.55;">
                <p style="margin:0;padding:0 0 12px;border-bottom:1px solid #e5bda5;color:#a63b15;font-family:Arial,Helvetica,sans-serif;font-size:22px;line-height:1.2;font-weight:bold;">Echaris</p>
                <p style="margin:12px 0 0;color:#a63b15;font:700 11px/1.4 Arial,Helvetica,sans-serif;letter-spacing:0.65px;text-transform:uppercase;">Identity verification</p>
                <h1 style="margin:4px 0 20px;color:#29211d;font-family:Georgia,'Times New Roman',serif;font-size:32px;line-height:1.18;font-weight:normal;overflow-wrap:anywhere;" th:text="${title}" class="ledger-title">
                    KYC update
                </h1>

                <p style="margin:0 0 12px;">
                    Hello
                    <span th:text="${name ?: 'there'}">there</span>,
                </p>

                <p th:text="${message}" style="margin:0 0 12px;">
                    Your identity document status has changed.
                </p>

                <p style="margin:0 0 12px;">
                    <strong>Document type</strong>
                    <br>
                    <span th:text="${documentType}"></span>
                </p>

                <p style="margin:0 0 12px;">
                    <strong>Customer reference</strong>
                    <br>
                    <span th:text="${customerId}"></span>
                </p>

                <div th:if="${reason != null and !#strings.isEmpty(reason)}">
                    <p style="margin:0 0 12px;">
                        <strong>Review reason</strong>
                        <br>
                        <span th:text="${reason}"></span>
                    </p>
                </div>

                <p style="margin:0 0 12px;">
                    Sign in to your Echaris account to view the details.
                </p>

            </td></tr>
            <tr><td style="padding:10px 24px;border-top:1px solid #e5bda5;color:#584942;font:12px/1.5 Arial,Helvetica,sans-serif;">The Echaris team</td></tr>
        </table>
        <!--[if mso]></td></tr></table><![endif]-->
    </td></tr>
</table>
</body>
</html>
