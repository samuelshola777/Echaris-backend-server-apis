<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payout sent</title>
</head>
<body>
<h2>Your Echaris payout has been sent</h2>
<ul>
    <li>Amount NGN <span th:text="${amount}"></span></li>
    <li>Payment time (UTC) <span th:text="${paidAt}"></span></li>
    <li>Transfer reference <span th:text="${transferReference}"></span></li>
    <li>Destination bank <span th:text="${bankName}"></span></li>
    <li>Account ending in <span th:text="${accountNumberLast4}"></span></li>
</ul>
<p>You can view the payout in your Echaris payment history.</p>
</body>
</html>
