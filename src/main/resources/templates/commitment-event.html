<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Echaris update</title>
</head>

<body style="background:#f6f6f6;color:#222;font-family:Arial,sans-serif;padding:24px;">

<table role="presentation"
       style="width:100%;max-width:600px;margin:auto;background:white;">
    <tr>
        <td style="padding:28px;">

            <p style="color:#ff5a00;font-size:24px;font-weight:bold;">
                Echaris
            </p>

            <h2 th:text="${title}">
                Commitment update
            </h2>

            <p>
                Hello
                <span th:text="${name}">there</span>,
            </p>

            <p th:text="${message}">
                Your commitment has an update.
            </p>

            <p>
                Sign in to your Echaris account to view the details.
            </p>

            <p>The Echaris team</p>

        </td>
    </tr>
</table>

</body>
</html>
